# Video2PersonVideo 默认配置
# 用法：v2pv --config configs/default.yaml -i data/input/demo.mp4
# 命令行参数优先级高于本文件。

# =============================== 模型与推理 ===============================
# 模型：可填模型名（ultralytics 会自动下载，如 yolo11n.pt / yolo11s.pt）
# 或本地权重路径（如 assets/models/yolo11n.pt）。
# n/s/m/l/x 依次变大：n 最快、x 最准。
model: yolo11n.pt

# 只保留哪些类别，[0] = COCO 的 person。留空 [] 表示输出所有类别。
classes: [0]

# 置信度阈值：越低召回越高（漏检少），但误检变多
conf: 0.25

# NMS 的 IoU 阈值：越小越激进地合并重叠框，人多拥挤的场景可适当调低
iou: 0.45

# 推理分辨率（必须是 32 的倍数）。640 是速度/精度平衡点，小目标多可调到 960/1280
imgsz: 640

# 单帧最多保留的目标数
max_det: 300

# 推理设备：null = 自动（有 CUDA 用 cuda:0，否则 cpu）；也可写 cpu / cuda:0
device: null

# =============================== 裁剪与构图 ===============================
# 是否启用"裁剪 + 构图"（关掉 = 保留旧的逐帧画框标注模式）
crop: true

# 是否在输出帧上叠加检测框（默认关闭，成品更干净）
annotate: false

# 目标长宽比。支持四种写法：
#   预置名称：9:16 / 16:9 / 1:1 / 4:3 / 3:4 / 4:5 / 5:4 / 3:2 / 2:3 / 21:9 / 2:1
#   自定义比例：3:5
#   目标像素：1080x1920（宽高会向上取偶数）
#   纯数字比值：1.7778
# 输出视频每一帧的宽/高恒等于该比例（不变量 1）。
aspect_ratio: "9:16"

# 自定义目标像素：两者同时给出才生效，否则按"短边 1080"自动推导。
# H.264 要求宽高均为偶数，非法值会被规整或直接报错（不变量 2）。
target_width: null
target_height: null

# 人物过小阈值：bbox 高度 / 画面高度 低于该值即视为"没有人物"。
# 0.73 表示只有画面里占比足够大的人（高度 ≥ 画面高的约四分之三）才算主要人物，
# 背景里的路人 / 小人一律忽略；想让更多小人参与，往小调（如 0.15）。
min_person_height_ratio: 0.73

# 主角打分权重（多人物时决定谁被追踪）：
#   面积得分（bbox 面积 / 画面面积）
subject_area_weight: 1.0
#   位置得分（越靠近画面中心越高）
subject_center_weight: 0.6
#   时序得分（与上一帧主角的 IoU，越大越不容易来回跳）
subject_continuity_weight: 1.2
#   置信度得分
subject_confidence_weight: 0.3

# =============================== 说话人跟随 ===============================
# 多个主要人物时，优先对准"正在说话的人"，而不是单纯"最大 / 最居中"的人。
#
# 为什么不能只靠 YOLO：它是纯图像模型，既没有音频输入，COCO-17 关键点里也没有
# 嘴部关键点（只有鼻 / 眼 / 耳 / 肩 / 髋…），所以"谁在说话"必须自己补上音频这一半。
# 本工具的做法（音频-视觉主动说话人检测）：
#   ① 音频：抽音轨算逐帧语音能量包络 + 语音/静音标记（需要系统里有 ffmpeg）；
#   ② 视觉：给每个主要人物定位嘴部 ROI，用"嘴部帧间差异 − 上半脸帧间差异"
#      度量嘴动强度（相减可抵消头部整体运动与镜头微动）；
#   ③ 判定：滑窗内把每人的嘴动信号与语音能量做归一化互相关，最同步者即说话人；
#      并且带**切换滞回**（连续多帧、明显领先才换人），避免镜头在两个人物间乱跳。
#
# 只在"画面里有两个及以上主要人物 + 音轨里有人在说话"时才会介入；
# 单人画面、无音轨、没有 ffmpeg、检测不到语音时都安静地退回普通主角打分。
speaker_tracking: true

# 说话人偏置的大小。偏置与主角打分**同量纲**（0~1）：≥ 1.0 时"正在说话的人"
# 必定胜出（无论对方更大 / 更居中 / 时序更连续）；比 1.0 小则是"软优先"，
# 越小越接近原来的主角打分规则。
speaker_weight: 1.8

# 语音-嘴动的相关性滑窗长度（帧），约 1~1.5 秒；太短易误判，太长跟不上换人
speaker_window_frames: 45

# 换人所需的最低领先分差（挑战者得分 − 在位者得分）
speaker_switch_margin: 0.15

# 换人前挑战者需要连续领先多少个判定回合（每次判定 = 一个关键帧）
speaker_switch_hold: 8

# 嘴动强度下限：说话时嘴部的帧间差异低于它，认为画面里读不出嘴型，不参与判定
# （人物太小 / 远景时把嘴动当成噪声反而更糟，故宁可放弃判定）
speaker_min_mouth_motion: 0.004

# =============================== 多人分屏（多个上半身窗口） ===============================
# 画面里出现**两个及以上主要人物**时，每人给一个上半身小窗口同时显示，
# 而不是整段视频只跟一个人。窗口怎么排由布局表决定：
#   configs/multi_person_layout.yaml（可用 --layout-config 换成自己的）
#
# 默认开启；关掉就回到"整段视频同时只显示一个人"的旧行为。
# 它只影响"画面里有两个及以上主要人物"的帧：
#   · 单人画面：输出与关闭时逐帧一致；
#   · 背景里的小人 / 路人（低于 min_person_height_ratio）不算主要人物，不进窗口。
#
# 每个小窗口的取景框按**该窗口自己的宽高比**计算，所以窄窗口切出来依然是半身构图，
# 不会被拉伸变形；输出分辨率仍然全程恒定（不变量 2）。
#
# 取景一律按"恰好装下该人物的上半身"来算（不看人物在画面里的大小分档）：
# 人物在画面里占比很小时也只会切出上半身，不会把腿部与左右大片非人物场景一起框进来。
# 上半身的"头顶 / 腰"优先取姿态关键点；没有关键点时按"头到腰 ≈ 1.6 个框宽"估算，
# 于是远景站姿会被收成半身，近景 / 坐姿（框本来就矮）则保持整条框。
multi_person: true

# 最多同时显示几个主要人物（2~9）：超出的按"正在说话的人 > 主角打分"取舍。
# 再多就只剩小窗口，看不清脸，反而没有意义。
multi_person_max: 4

# 人物排列顺序：
#   spatial（默认）= 正在说话的人坐 1 号窗口（通常最大 / 最靠上），
#                    其余人按画面位置从左到右、从上到下依次入座 —— 左的人就在左窗口
#   score          = 完全按主角打分（谁最抢镜谁坐 1 号窗口）
multi_person_order: spatial

# 多人布局表（YAML）。null = 用默认路径 configs/multi_person_layout.yaml；
# 文件不存在时用内置默认布局（与仓库里的表一致），不影响正常出片。
# 显式指定了路径却找不到文件时会直接报错，不做静默降级。
multi_person_layout_file: null

# 构图分档阈值（bbox 高 / 画面高）：
#   ≥ closeup_ratio → 头像/大特写；≥ halfbody_ratio → 半身；否则全身
closeup_ratio: 0.75
halfbody_ratio: 0.25
# 各档位下"人物高度占取景框高度的比例"，越大人物越大
closeup_fill: 0.90
halfbody_fill: 0.70
fullbody_fill: 0.55
# 人体被画面边缘截断时改用更保守的取景（避免裁到只剩半张脸）
incomplete_fill: 0.50
# 半身构图时头顶留白占取景框高度的比例
headroom: 0.08
# 取景框最小边长（像素），避免人物过小时极端放大
min_box_px: 96

# =============================== 镜头稳定（时序平滑） ===============================
# 逐帧独立裁剪会抖，这里把"每一帧的目标取景框"串成一条连续轨迹。
#
# 注意：只做 EMA 解决的是"抖"，解决不了"晃"—— 人物一走镜头就跟着平移，背景整体
# 流动，看久了容易头晕（视觉与前庭冲突）。因此这里的策略是"像真人摄像师"：
#
#   ① 自由活动区（smoothing_deadzone）：人物在取景框内走动、偏离量小于它时，
#      镜头**完全不动**（背景静止）。这是缓解头晕最有效的一项，也是"锁死"档位
#      的主要手段。想更稳就往大调（0.25~0.35），想更跟手就往小调（0.05~0.10）。
smoothing_deadzone: 0.06
#   ② 平移平滑系数（smoothing_alpha）：越过自由活动区后，镜头逼近目标的比例。
#      越大越跟手，越小越稳。
smoothing_alpha: 0.45
#   ③ 平移速度上限（相对框长 / 帧）：防止"甩镜"。0 = 不限制；越小越稳。
#      人物偏离越多，上限会自动放宽（但只放宽到 4 倍就平滑封顶），所以调小不会
#      把人放出画面，也不会因为人跑得快就变成一次急促的大幅横摇。
smoothing_max_speed: 0.05
#   ④ 加速平滑 (0, 1]：越小起步/反向越柔和（不"窜"），1 = 不限制。
smoothing_accel: 0.5
#   ⑤ 缩放（推拉）比平移更慢、死区更大 —— 缩放带来的不适比平移更强，
#      单独控制才能压住"呼吸式变焦"。
smoothing_zoom_alpha: 0.15
smoothing_zoom_deadzone: 0.05
# 丢失目标（遮挡 / 转头）时沿用上一帧取景框的最大帧数
hold_frames: 30
# ⑥ 「空镜巡视」的单程时长（秒）：只在 no_person_mode = scan 时用得上。
#    保持超时后画面里仍然没有主要人物时，如果源画面比目标取景框更宽（典型场景：
#    横屏素材转竖屏），直接居中裁剪会一次性丢掉左右约三分之二的内容；巡视改为让
#    取景框沿那条"多出来的轴"缓慢往返，用几个来回把整幅画面看完。
#    数值是**单程时长（秒）**：越大越慢越舒缓（12 秒 ≈ 6px/帧，几乎察觉不到在动），
#    0 = 关闭巡视、退回画面居中裁剪；源比例与目标比例一致时本来就没有可巡视的空间。
smoothing_scan_seconds: 12.0
#
# 上面 ①~⑥ 的速度语义都是**每秒的感受**（按 30fps 标定），处理时用源视频的真实
# 帧率换算：24 / 30 / 60fps 的素材，镜头运动的真实速度与时长一致，无需按帧率改参数。
#
# 不想调数值？命令行 `--camera-follow lock|calm|standard|active` 一次设置一组
# （锁定 / 舒缓 / 标准 / 跟手），界面第 2 步的「镜头跟随」下拉是同一套档位。
# 默认档位为「跟手」（active），即上面这几项的默认值；容易看晕可换 lock / calm。

# =============================== 没有主要人物时显示什么 ===============================
# 保持超时（hold_frames）之后画面里仍然没有主要人物时，怎么显示这一段画面。
# 默认 fit（全画面适配）：整幅画面等比缩小、完整放进输出画布，一帧看全、镜头完全不移动。
# 横屏素材放进竖屏时上下会空出大片，用**同一帧的模糊放大版**填满（不是黑边）。
#   fit    全画面适配（默认）：不裁剪、不放大，最不容易看晕
#   tiles  全景 + 特写：整幅画面收进上方通栏，下面纵向排列几个"远景小人物"的半身特写
#          —— 既保住环境全貌，又能看清被 min_person_height_ratio 过滤掉的那些人；
#          画面里没有够大的小人物、或竖屏里排不下时，自动退回全画面适配
#   scan   空镜巡视：取景框缓慢扫过整幅画面（任一时刻只看得到局部，且画面一直在动）
#   center 只取画面正中：最保守的一档
no_person_mode: fit

# 从"人物取景框"过渡到无人物显示的时长（秒）：0.8 秒的舒缓拉远，
# 不会在人物走出画面的那一帧"啪"地跳一下；0 = 立即切换。
no_person_seconds: 0.8

# 无人物画面的底色是否用"同一帧的模糊放大版"：
# true  = 上下 / 左右空出来的部分填模糊画面（推荐，观感连贯）
# false = 填下面 multi_person 的纯色底色
no_person_blur: true

# 「全景 + 特写」最多给几个小人物开特写窗口（1~4）。
# 每一格都是"该人物恰好装下上半身"的紧致取景，所以远景小人也会被放大成半身；
# 但放大倍率有限（源画面里太小的人放大了也只是马赛克），故数量不宜多。
no_person_tiles_max: 2

# 「次要小人物」的高度下限（占画面比例）：低于它的不给特写。
# 与 min_person_height_ratio（主人物下限）之间的那些人，才算"值得特写的远景人物"。
no_person_secondary_ratio: 0.12

# =============================== 性能 ===============================
# 每 N 帧做一次 YOLO 推理，中间帧用线性插值追踪取景框
# N=1 追求质量（逐帧推理）；长视频提速可调成 2~5
detect_interval: 1

# 一次推理塞几帧（批量帧推理，M1-7）。攒够这么多关键帧再一起送进模型，
# GPU 上吞吐提升明显；默认 1 = 不攒批（延迟最低）。
# 显存吃紧时保持 2~8；这个值越大，出画延迟越高（输出顺序不受影响）。
infer_batch: 1

# 用姿态关键点精修构图（M1-3 可选增强）。
# 仅当模型自带关键点时生效：把 model 换成 yolo11n-pose.pt / yolo11s-pose.pt 即可。
# 开启后"半身"档位的下边界取腰/髋（而不是整条 bbox 的底边），
# 头顶也会用面部关键点纠正（人物抬手时不至于把画面顶偏）。
use_keypoints: true

# =============================== 输出 ===============================
# 是否保留原视频音轨（OpenCV 写出的视频没有声音，需要 ffmpeg 合并回来）
save_audio: true

# 时间轴归一化：处理前先探测源视频的帧率 / 时长信息，若源是可变帧率（VFR，
# 手机录像 / 录屏 / 剪辑导出很常见），先用 ffmpeg 把画面归一到恒定帧率再逐帧处理。
# 不做这一步的话，OpenCV 只能用单一 fps 逐帧写回，画面会被"均匀摊平"：帧率高的
# 片段慢放、帧率低的片段快进 —— 表现就是"视频开头画面很慢，然后忽然变快"，而声音
# 始终正常。需要系统里有 ffmpeg；缺失时自动跳过并保持原行为。
normalize_vfr: true

# 是否用 ffmpeg 把结果重编码为 H.264（体积更小、兼容性更好；无 ffmpeg 时自动跳过）
reencode: false

# 重编码质量，数值越小画质越好、体积越大。生效于两处：
#   1) reencode 为 true 时转成 H.264；
#   2) 无声视频时长与音轨时长不一致、需要校正音画同步时。
crf: 23

# 体积守护：裁剪后的画面由 OpenCV 写成 mp4v（MPEG-4 Part 2），同等画质下需要的
# 码率是 H.264 的好几倍；源视频分辨率低、输出又被放大时，成品体积常常是原视频的
# 3~10 倍。开启后，一旦 "输出体积 > 原视频 × max_size_ratio" 就自动用 ffmpeg
# 按体积上限反推码率、压成 H.264（无 ffmpeg 时只告警，不影响出片）。
size_guard: true

# 输出体积相对原视频的倍数上限：1.0 = 不超过原视频，1.5 = 允许大出 50%
max_size_ratio: 1.0

# 自动压缩时的视频码率下限（kbps）：再低就只剩马赛克，宁可保留稍大的文件
min_video_bitrate_kbps: 250

# 输出位置与命名（M0 决策）：
#   true  → 原视频同目录；false → 统一 data/output/
output_same_dir: true
# 强制输出后缀，如 ".mp4"；null = 沿用原视频后缀
output_suffix: null
# 同名输出已存在时是否覆盖；false = 跳过并在日志里标注"已存在"
overwrite: false
# 写入元数据标记（比例 / 输出尺寸 / 模型 / 处理时间），便于追溯
write_metadata: false
# 额外输出一张首帧构图预览图 <名称>_preview.jpg
write_preview: false

# 是否额外保存标注后的关键帧图片（null = 不保存）
save_frames_dir: null

# =============================== 批量 ===============================
# 输入是文件夹时是否递归遍历子目录
batch_recursive: true

# =============================== 其他 ===============================
# 处理过程中弹窗实时预览（需要桌面环境，命令行批量处理时建议关闭）
show: false

# 日志级别：DEBUG / INFO / WARNING / ERROR
log_level: INFO

# ============================================================================
# 多人分屏布局表（Video2PersonVideo）
#
# 作用：画面里出现**两个及以上主要人物**时，每人给一个"上半身"小窗口同时显示。
#       小窗口怎么排，由「输出长宽比 + 人数」在这里查表决定。
#
# 用法：v2pv -i demo.mp4 --ratio 9:16 --layout-config configs/multi_person_layout.yaml
#       也可以完全不写这个文件 —— 内置默认布局与下表完全一致。
#       文件名可以用 AppConfig.multi_person_layout_file / CLI --layout-config 指定。
#
# 网格写法（字符串列表，一个字符串 = 网格的一行）：
#     ["12", "34"]   2 行 2 列，四个等大窗口（编号 1 在左上，以此类推）
#     ["11", "23"]   上面一个通栏大窗（1 号），下面左右两个小窗（2、3 号）
#     ["12", "13"]   左边一个通高大窗（1 号，占两行），右边上下两个小窗
#     同一个数字连续占多格 = 合并单元格（必须是规则矩形）；
#     "." / "_" / "-" / 空格 = 留白（填底色），一般用不到。
#
# 编号就是"窗口优先级"：1 号优先给「正在说话的人」，如果没人说话就给主角；
# 其余人物按空间位置（先上后下、先左后右）依次填 2、3、4… 号窗口。
# 所以 1 号窗口应该是你希望"最重要的人"待的那个位置（通常最大 / 最靠上）。
#
# 每一条也可以写完整形式，给某一行/列单独加权（权重按网格行列分配）：
#     3: {grid: ["12", "13"], cols: [1.4, 1.0]}   # 左列更宽（主角窗更大）
# ============================================================================

# --------------------------- 全局外观（可选，写错会直接报错） ---------------------------
# 窗口之间的缝隙，相对输出短边的比例（0.006 ≈ 1080 短边下 6 像素）
gap_ratio: 0.006

# 缝隙与留白的底色（BGR 三元组，或写 "#121212"）
background: [18, 18, 18]

# 加窗口需要连续多少帧都检到新的人，才真的换布局。
# 检测偶尔漏一个人时，布局不会跟着抖一下（越大越稳、越小越跟手）。
# 注：**撤窗口**（人少了一个 / 全走光了）用的是 --hold-frames（默认 30 帧）——
#     漏检、转身、短暂遮挡都会让人数瞬间少一个，若立刻改布局，画面就会一闪一闪。
switch_hold: 3

# --------------------------- 比例归类（可选） ---------------------------
# 比例名 → 布局族。没写进这里的比例（含自定义比例，如 7:8）会按宽高比自动归类：
#   宽/高 < 0.95 → portrait（竖屏） | 0.95~1.05 → square（方形） | > 1.05 → landscape（横屏）
groups:
  "16:9": landscape
  "4:3": landscape
  "3:2": landscape
  "5:4": landscape
  "21:9": landscape
  "2:1": landscape
  "1:1": square
  "9:16": portrait
  "4:5": portrait
  "3:4": portrait
  "2:3": portrait

# --------------------------- 布局表 ---------------------------
# 键可以是「族名」（portrait / square / landscape），也可以是「具体比例名」（"9:16"）。
# 具体比例名优先于族名，因此可以给某个比例单独定制排版。
#
# 表里查不到的人数（或超过 9 人）会按画面宽高比自动生成一个尽量方的网格 ——
# 所以这里不必写全，只写你想改的档位即可（其余沿用内置默认）。
layouts:
  # ========================== 竖屏（9:16 / 4:5 / 3:4 / 2:3） ==========================
  portrait:
    2: ["1", "2"]                 # 上下各一半（1080×960 一格，接近半身比例）
    3: ["11", "23"]               # 上面一个通栏大窗（说话人 / 主角），下面左右两个
    4: ["12", "34"]               # 2×2（每格 540×960，窄竖窗正好切上半身）
    5: ["11", "23", "45"]         # 上大窗 + 中间两个 + 下面两个
    6: ["12", "34", "56"]         # 三行两列（每格 540×640，人像比例最舒服）

  # ========================== 方形（1:1） ==========================
  square:
    2: ["12"]                     # 左右各一半（540×1080）
    3: ["11", "23"]               # 上通栏 + 下两个
    4: ["12", "34"]               # 2×2（每格 540×540）
    5: ["112", "345"]             # 上排：1 号占两格 + 一个；下排三个
    6: ["123", "456"]             # 2 行 3 列（每格 360×540）

  # ========================== 横屏（16:9 / 21:9 / 2:1 …） ==========================
  landscape:
    2: ["12"]                     # 左右各一半（960×1080，半身构图很自然）
    3: ["12", "13"]               # 左边通高大窗（1 号）+ 右边上下两个小窗
    4: ["12", "34"]               # 2×2（每格 960×540）
    5: ["112", "345"]             # 上排：1 号占两格 + 一个；下排三个
    6: ["123", "456"]             # 2 行 3 列（每格 640×540）

  # ===================== 具体比例的单独覆盖（优先级高于上面的族） =====================
  # 例如竖屏 3 人希望"主角大窗更宽"，把左列权重调大即可：
  # "9:16":
  #   3: {grid: ["11", "23"], rows: [1.2, 1.0]}
